services:
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_core_ai_audit
      POSTGRES_USER: piano_core
      POSTGRES_PASSWORD: isolated_core_password
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano_core -d piano_core_ai_audit"]
      interval: 2s
      retries: 30
  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_agent_ai_audit
      POSTGRES_USER: piano_agent
      POSTGRES_PASSWORD: isolated_agent_password
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano_agent -d piano_agent_ai_audit"]
      interval: 2s
      retries: 30
  core:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    environment:
      CORE_DATABASE_URL: postgresql://piano_core:isolated_core_password@core-db:5432/piano_core_ai_audit
      CORE_PORT: 3000
      AGENT_RUNTIME_URL: http://agent:3100
      INTERNAL_SERVICE_SECRET: isolated-audit-internal-secret-2026
      JWT_SIGNING_SECRET: isolated-audit-jwt-signing-secret-2026
      JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      AI_AUDIT_BUSINESS_NOW: '2026-10-21T03:00:00.000Z'
    networks: [private]
    command: ["sh", "-c", "export CAPABILITY_SIGNING_PRIVATE_KEY_B64=\"$$(node -e 'const c=require(\"node:crypto\");process.stdout.write(Buffer.from(c.generateKeyPairSync(\"ed25519\").privateKey.export({type:\"pkcs8\",format:\"pem\"})).toString(\"base64\"))')\" && npm run db:migrate:deploy -w @piano/core-api && node apps/core-api/test/ai-audit-server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 40
  agent:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
    environment:
      AGENT_PORT: 3100
      AGENT_WORKER_ENABLED: 'true'
      AGENT_DATABASE_URL: postgresql://piano_agent:isolated_agent_password@agent-db:5432/piano_agent_ai_audit
      CORE_INTERNAL_API_URL: http://core:3000/api/internal
      INTERNAL_SERVICE_SECRET: isolated-audit-internal-secret-2026
      AI_ENABLED: 'true'
      AI_PROVIDER: deepseek
      AI_MODEL: '${AI_MODEL:?set AI_MODEL}'
      AI_API_KEY: '${AI_API_KEY:?set AI_API_KEY}'
      AI_REQUEST_TIMEOUT_MS: 20000
      AI_RUN_TIMEOUT_MS: 90000
      AI_MAX_OUTPUT_TOKENS: 1600
      AI_AUDIT_BUSINESS_NOW: '2026-10-21T03:00:00.000Z'
    networks: [private, egress]
    command: ["sh", "-c", "npm run db:migrate -w @piano/agent-runtime && npm run checkpoint:setup -w @piano/agent-runtime && node apps/agent-runtime/test/ai-audit-server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 40
networks:
  private:
    internal: true
  egress: {}
