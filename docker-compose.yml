services:
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_core
      POSTGRES_USER: piano_core
      POSTGRES_PASSWORD: piano_core_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano_core -d piano_core"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - core-db-data:/var/lib/postgresql/data

  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_agent
      POSTGRES_USER: piano_agent
      POSTGRES_PASSWORD: piano_agent_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano_agent -d piano_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agent-db-data:/var/lib/postgresql/data

volumes:
  core-db-data:
  agent-db-data:
