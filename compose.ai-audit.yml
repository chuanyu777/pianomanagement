name: piano-ai-audit
services:
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_core_ai_audit
      POSTGRES_USER: piano_core
      POSTGRES_PASSWORD: piano_core_audit_only
    ports: ["127.0.0.1:5443:5432"]
    volumes: ["audit-core-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano_core -d piano_core_ai_audit"]
      interval: 2s
      retries: 30
  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_agent_ai_audit
      POSTGRES_USER: piano_agent
      POSTGRES_PASSWORD: piano_agent_audit_only
    ports: ["127.0.0.1:5444:5432"]
    volumes: ["audit-agent-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano_agent -d piano_agent_ai_audit"]
      interval: 2s
      retries: 30
  core:
    image: pianomanager-core:ai-audit
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    environment:
      CORE_DATABASE_URL: postgresql://piano_core:piano_core_audit_only@core-db:5432/piano_core_ai_audit
      CORE_PORT: 3000
      AGENT_RUNTIME_URL: http://agent:3100
      INTERNAL_SERVICE_SECRET: piano-audit-only-internal-secret-2026
      JWT_SIGNING_SECRET: piano-audit-only-jwt-signing-secret-2026
      JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      AGENT_REQUEST_TIMEOUT_MS: 20000
      AGENT_STREAM_IDLE_TIMEOUT_MS: 60000
      AI_AUDIT_BUSINESS_NOW: "2026-10-21T03:00:00.000Z"
    ports: ["127.0.0.1:3010:3000"]
    depends_on:
      core-db: {condition: service_healthy}
    command:
      - sh
      - -c
      - >-
        export CAPABILITY_SIGNING_PRIVATE_KEY_B64="$$(node -e 'const c=require("node:crypto");process.stdout.write(Buffer.from(c.generateKeyPairSync("ed25519").privateKey.export({type:"pkcs8",format:"pem"})).toString("base64"))')"
        && npm run db:migrate:deploy -w @piano/core-api
        && node apps/core-api/test/ai-audit-server.mjs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 30
  agent:
    image: pianomanager-agent:ai-audit
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
    environment:
      AGENT_PORT: 3100
      AGENT_WORKER_ENABLED: "true"
      AGENT_DATABASE_URL: postgresql://piano_agent:piano_agent_audit_only@agent-db:5432/piano_agent_ai_audit
      CORE_INTERNAL_API_URL: http://core:3000/api/internal
      INTERNAL_SERVICE_SECRET: piano-audit-only-internal-secret-2026
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_REQUEST_TIMEOUT_MS: 20000
      AI_RUN_TIMEOUT_MS: 90000
      AI_MAX_OUTPUT_TOKENS: 1600
      AI_AUDIT_BUSINESS_NOW: "2026-10-21T03:00:00.000Z"
    ports: ["127.0.0.1:3110:3100"]
    depends_on:
      agent-db: {condition: service_healthy}
      core: {condition: service_healthy}
    command: ["sh", "-c", "npm run db:migrate -w @piano/agent-runtime && npm run checkpoint:setup -w @piano/agent-runtime && node apps/agent-runtime/test/ai-audit-server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 30
  web:
    image: pianomanager-web:ai-audit
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:5180:80"]
    depends_on:
      core: {condition: service_healthy}
      agent: {condition: service_healthy}
volumes:
  audit-core-data:
  audit-agent-data:
